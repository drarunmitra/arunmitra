baseURL: https://arunmitra.com/
theme: hugo-apero
languageCode: en
title: Arun Mitra Peddireddy
author: Arun Mitra Peddireddy
enableRobotsTXT: true
copyright: ''
googleAnalytics: ''
disqusShortname: ''
metaDataFormat: yaml
footnoteReturnLinkContents: '&#8617;'
paginate: 20
preserveTaxonomyNames: yes
ignoreFiles:
  - \.Rmd$
  - \.Rmarkdown$
  - _cache$
  - \.knit\.md$
  - \.utf8\.md$
enableEmoji: yes
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      hardwraps: no
      unsafe: yes
  highlight:
    style: github
  tableOfContents:
    endLevel: 2
    ordered: no
    startLevel: 2
params:
  custom_theme: ''
  customheadingFontFamily: Fraunces
  customtextFontFamily: Bitter
  description: Dr. Arun Mitra Peddireddy (Arun Mitra), Assistant Professor of Community and Family Medicine at AIIMS Bibinagar. Spatial epidemiology, maternal-child health, R training.
  favicon: /img/icon2.ico
  headingFontFamily: sans-serif
  logo: /img/arunmitralogo.png
  mainSections:
    - blog
    - research
    - training
    - talk
  math:
    renderer: katex
  navallcaps: yes
  orgLocal: India
  orgName: Arun Mitra Peddireddy
  sharing_image: /img/arun2.jpg
  social:
    - icon: github
      icon_pack: fab
      url: https://github.com/drarunmitra
    - icon: twitter
      icon_pack: fab
      url: https://twitter.com/drarunmitra
    - icon: researchgate
      icon_pack: ai
      url: https://www.researchgate.net/profile/Arun-Mitra
    - icon: orcid
      icon_pack: ai
      url: https://orcid.org/0000-0001-6742-4033
    - icon: google-scholar
      icon_pack: ai
      url: https://scholar.google.com/citations?hl=en&user=whNtX04AAAAJ
  socialInFooter: yes
  socialInHeader: no
  textFontFamily: sans-serif
  theme: grayscale
  twitter: drarunmitra
  utterances:
    issue_term: pathname
    label: 'comments :crystal_ball:'
    repo_name: drarunmitra/arunmitra
    theme: boxy-light
    use_utterances: yes
taxonomies:
  category: categories
  series: series
  tag: tags
menu:
  footer:
    - name: Contact
      title: Contact form
      url: /contact/
      weight: 2
    - name: Credits
      title: Theme credits
      url: /contributors/
      weight: 3
  header:
    - name: About
      title: About Arun
      url: /about/
      weight: 1
    - name: Research
      title: Research Projects
      url: /research/
      weight: 2
    - name: Publications
      title: Publications
      url: /publications/
      weight: 3
    - name: Training
      title: Training & Workshops
      url: /training/
      weight: 3
    - name: Teaching
      title: Teaching and lecture slides
      url: /teaching/
      weight: 4
    - name: Tools
      title: Tools & Resources
      url: /tools/
      weight: 4
    - name: Blog
      title: Blog
      url: /blog/
      weight: 5
    - name: Talks
      title: Talks
      url: /talk/
      weight: 6
    - name: Contact
      title: Contact
      url: /contact/
      weight: 8
privacy:
  disqus:
    disable: no
  googleAnalytics:
    anonymizeIP: yes
    disable: no
    respectDoNotTrack: yes
  instagram:
    disable: no
    simple: yes
  twitter:
    disable: no
    enableDNT: yes
    simple: no
  vimeo:
    disable: no
    enableDNT: yes
    simple: yes
  youtube:
    disable: no
    privacyEnhanced: yes

security:
  funcs:
    getenv:
      - ^HUGO_
      - ^BLOGDOWN_POST_RELREF$
